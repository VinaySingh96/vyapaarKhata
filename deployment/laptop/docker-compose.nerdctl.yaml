version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vyapaarkhata-postgres
    restart: always
    environment:
      POSTGRES_DB: vyapaarkhata_prod
      POSTGRES_USER: vyapaarkhata
      POSTGRES_PASSWORD: vyapaarkhata_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - vyapaarkhata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyapaarkhata -d vyapaarkhata_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: vyapaarkhata-server:latest
    container_name: vyapaarkhata-server
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://vyapaarkhata:vyapaarkhata_secure_password@postgres:5432/vyapaarkhata_prod
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vyapaarkhata-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: vyapaarkhata-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../apps/web/dist:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - vyapaarkhata-net

volumes:
  pgdata:
    driver: local

networks:
  vyapaarkhata-net:
    driver: bridge
